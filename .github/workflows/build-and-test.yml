name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-and-test:
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # vcpkg is pre-installed on GitHub-hosted Windows runners (VCPKG_INSTALLATION_ROOT).
      # This exposes GitHub Actions cache credentials so vcpkg can cache built binaries
      # (e.g. Dawn/WebGPU) across runs via the x-gha binary cache source above.
      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # CMake picks the vcpkg toolchain file up automatically (see root
      # CMakeLists.txt), and the "windows" preset uses the "Visual Studio 17
      # 2022" generator, so CMake locates cl.exe/MSBuild itself - no manual
      # PlatformToolset override or vcvarsall activation needed here, unlike
      # the old hand-written .vcxproj files (which pinned an unavailable
      # preview toolset).
      - name: Configure (CMake + vcpkg manifest restore)
        shell: pwsh
        run: cmake --preset windows

      - name: Build (Release)
        shell: pwsh
        run: cmake --build --preset windows-release

      - name: Run Google Tests (ctest)
        shell: pwsh
        run: ctest --preset windows-release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
